# Pinned environment for PyleoclimPaper v1.0.0 (notebooks updated 2024-07-24).
# Versions are the latest releases available on or before 2024-07-24.
name: base
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.1.4          # pinned by pyleoclim 1.1.0
  - scipy=1.14.0
  - matplotlib=3.9.1
  - cartopy=0.23.0
  - seaborn=0.13.2
  - statsmodels=0.14.2
  - scikit-learn=1.5.1
  - numba=0.60.0
  - xarray=2024.6.0
  - netcdf4=1.7.1
  - bottleneck=1.4.0
  - dask=2024.7.1
  - climlab=0.8.2
  - jupyterlab=4.2.4
  - ipykernel=6.29.5
  - pip
  - pip:
    - pyleoclim==1.1.0
    - git+https://github.com/LinkedEarth/pylipd.git@0f7743afac
    - Unidecode==1.3.8
    - kneed==0.8.5
    - nitime==0.11
    - pathos==0.3.2
    - tftb==0.1.4
    - wget==3.2
    - tabulate==0.9.0
    - tqdm==4.66.4
    - beautifulsoup4==4.12.3
    - doi2bib==0.4.0
    - pybtex==0.24.0
    - bagit==1.8.1
